name: KurierX
options:
  bundleIdPrefix: cz.courierledger
  deploymentTarget:
    iOS: '17.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
targets:
  KurierX:
    type: application
    platform: iOS
    sources:
      - path: KurierX
    resources:
      - path: KurierX/Resources/GoogleService-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.courierledger.ios
        PRODUCT_NAME: KurierX
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KurierX
        INFOPLIST_KEY_NSCameraUsageDescription: KurierX uses the camera to scan courier screens and orders.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: KurierX uses selected photos for OCR import.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
