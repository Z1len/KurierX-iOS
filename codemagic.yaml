workflows:
  ios-simulator:
    name: KurierX iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Resolve Swift packages
        script: |
          set -e
          success=0
          for i in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project KurierX.xcodeproj -scheme KurierX; then
              success=1
              break
            fi
            echo "Resolve failed, retry $i/3"
            sleep 12
          done
          test "$success" = "1"
      - name: Build for iOS Simulator
        script: |
          set -o pipefail
          xcodebuild -project KurierX.xcodeproj -scheme KurierX -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

  ios-unsigned:
    name: KurierX iPhone Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Resolve Swift packages
        script: |
          set -e
          success=0
          for i in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project KurierX.xcodeproj -scheme KurierX; then
              success=1
              break
            fi
            echo "Resolve failed, retry $i/3"
            sleep 12
          done
          test "$success" = "1"
      - name: Build unsigned device app
        script: |
          set -e
          xcodebuild -project KurierX.xcodeproj -scheme KurierX -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          rm -rf Payload KurierX-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KurierX.app Payload/
          zip -r KurierX-unsigned.ipa Payload
    artifacts:
      - KurierX-unsigned.ipa
